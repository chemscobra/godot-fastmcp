[project]
name = "godot-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [ "fastmcp>=2.13.1" ]


[dependency-groups]
dev = [
 "psutil>=7.1.3",
 "pytest>=9.0.1",
 "pytest-asyncio>=1.3.0",
]


[tool.pytest.ini_options]
testpaths = [ "tests" ]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [ "-v", "--tb=short", "--strict-markers", "--color=yes" ]
markers = [
"integration: mark test as an integration test (local only)",
"slow: mark test as slow running",
"requires_godot: mark test as requiring Godot installation"
]
